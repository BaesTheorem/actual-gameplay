name: ActualGameplay
options:
  bundleIdPrefix: com.baestheorem
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
targets:
  ActualGameplay:
    type: application
    platform: iOS
    sources:
      - ActualGameplay/Sources
      - ActualGameplay/Assets.xcassets
      - ActualGameplay/Fonts
      - path: ActualGameplay/Levels
        type: folder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.baestheorem.actualgameplay
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: ActualGameplay/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        SWIFT_VERSION: "5.9"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  ActualGameplayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ActualGameplayTests]
    dependencies:
      - target: ActualGameplay
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        SWIFT_VERSION: "5.9"
schemes:
  ActualGameplay:
    build:
      targets:
        ActualGameplay: all
        ActualGameplayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ActualGameplayTests]
    archive:
      config: Release

name: Deploy the web build to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["web/**", "ActualGameplay/Art/**", "ActualGameplay/Audio/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # The asset build re-encodes the music with ffmpeg.
      - run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: npm run assets
      # The levels are tested, not trusted: a deploy stops if a stored solution no longer wins.
      - run: npm test
      - run: npm run replay -- pinPull
      - run: npm run replay -- runner
      - run: npm run replay -- saveDog
      # Every level ships with its measured difficulty: a level with no figure, or one measured
      # before the level last changed, stops the deploy until "npm run stats" has been run.
      - run: npm run stats -- --check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
